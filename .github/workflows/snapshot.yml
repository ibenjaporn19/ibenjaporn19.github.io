name: LINE Dashboard Snapshot

on:
  schedule:
    # Runs every 30 min at :16 and :46 past the hour, 08:16 through 20:46
    # Asia/Bangkok (UTC+7). Matches the data source's own 30-min update cadence
    # (data lands at :00/:30, with up to 15 min insert delay -> ready by
    # :15/:45), so :16/:46 clears the worst case with only ~1 min to spare,
    # minimizing the gap between insert_time and when this actually checks it.
    # GitHub Actions cron is always UTC, so these are 7 hours earlier: 01:16-13:46.
    - cron: '16,46 1-13 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab for testing

permissions:
  contents: write   # needed so the workflow can commit the snapshot + state file back to the repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # fail fast instead of hanging for GitHub's default 6-hour job timeout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Thai fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg

      - name: Install dependencies
        run: npm install puppeteer node-fetch@2

      - name: Run snapshot + LINE push script
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          # EDIT these two to match your actual repo/site:
          DASHBOARD_URL: https://YOUR_GH_USERNAME.github.io/YOUR_REPO/nano_dashboard.html
          SNAPSHOT_PUBLIC_URL_BASE: https://raw.githubusercontent.com/YOUR_GH_USERNAME/YOUR_REPO/main
          SHEET_JSON_URL: https://opensheet.elk.sh/1AEQSsiLUbr5p6HYh36WNGF9TkUDVeW2xN-vDvDkjy1k/1
        run: node .github/scripts/snapshot.js
