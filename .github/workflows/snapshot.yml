name: LINE Dashboard Snapshot

on:
  schedule:
    # Runs at 08:20, 10:20, 12:20, 14:20, 16:20, 18:20, 20:20 Asia/Bangkok (UTC+7)
    # Offset by 20 min past each 2-hour mark to safely clear the sheet's
    # worst-case insert delay (data source updates every 30 min, with up to
    # a 15-min lag before insert_time reflects the new batch).
    # GitHub Actions cron is always UTC, so these are 7 hours earlier.
    - cron: '20 1,3,5,7,9,11,13 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab for testing

permissions:
  contents: write   # needed so the workflow can commit the snapshot + state file back to the repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Thai fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg

      - name: Install dependencies
        run: npm install puppeteer node-fetch@2

      - name: Run snapshot + LINE push script
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          # EDIT these two to match your actual repo/site:
          DASHBOARD_URL: https://YOUR_GH_USERNAME.github.io/YOUR_REPO/nano_dashboard.html
          SNAPSHOT_PUBLIC_URL_BASE: https://raw.githubusercontent.com/YOUR_GH_USERNAME/YOUR_REPO/main
          SHEET_JSON_URL: https://opensheet.elk.sh/1AEQSsiLUbr5p6HYh36WNGF9TkUDVeW2xN-vDvDkjy1k/1
        run: node .github/scripts/snapshot.js
